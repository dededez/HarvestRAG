name: harvest-rag
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env.v2
  environment:
    V2_DATABASE_URL: postgresql://scraper:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.v2}@postgres:5432/scraper
    V2_MILVUS_URI: http://milvus:19530
    V2_ARTIFACT_DIR: /artifacts
  volumes:
    - artifacts:/artifacts
    - models:/models
  depends_on:
    postgres:
      condition: service_healthy
    milvus:
      condition: service_healthy
  restart: unless-stopped
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: scraper
      POSTGRES_DB: scraper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U scraper -d scraper"]
      interval: 5s
      timeout: 5s
      retries: 20
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
    volumes: [etcd:/etcd]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    command: minio server /minio_data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio:/minio_data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 10
  milvus:
    image: milvusdb/milvus:v2.6.0
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    volumes: [milvus:/var/lib/milvus]
    depends_on:
      etcd: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20
  api:
    <<: *app
    command: [python, -m, harvest_rag, serve, --host, 0.0.0.0]
    ports: ["127.0.0.1:8000:8000"]
  worker:
    <<: *app
    command: [python, -m, harvest_rag, worker]
volumes:
  postgres:
  etcd:
  minio:
  milvus:
  artifacts:
  models:
